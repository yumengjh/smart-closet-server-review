services:
  server:
    image: ghcr.io/yumengjh/smart-closet-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      agent-runtime:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      CLOSET_STORAGE_DIR: /data
      CLOSET_MODEL_PATH: /models/u2net.onnx
      CLOSET_AGENT_RUNTIME_URL: http://agent-runtime:8091
      CLOSET_AGENT_CALLBACK_URL: http://server:8080
      CLOSET_AGENT_SECRET: ${CLOSET_AGENT_SECRET:?Set CLOSET_AGENT_SECRET to a random value of at least 32 characters}
      CLOSET_BOOTSTRAP_USERNAME: ${CLOSET_BOOTSTRAP_USERNAME:-}
      CLOSET_BOOTSTRAP_PASSWORD: ${CLOSET_BOOTSTRAP_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - closet-data:/data
      - ./models:/models:ro
      - ./.local:/app/.local:ro

  agent-runtime:
    image: ghcr.io/yumengjh/smart-closet-server-agent:${IMAGE_TAG:-latest}
    build:
      context: ./agent-runtime
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      CLOSET_AGENT_HOST: 0.0.0.0
      CLOSET_AGENT_PORT: 8091
      CLOSET_AGENT_SECRET: ${CLOSET_AGENT_SECRET:?Set CLOSET_AGENT_SECRET to a random value of at least 32 characters}
    expose:
      - "8091"

volumes:
  closet-data:
