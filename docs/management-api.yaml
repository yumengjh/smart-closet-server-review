openapi: 3.1.0
info:
  title: Smart Closet Management API
  version: 1.1.0
  description: |
    鱼搭中立管理接口。默认关闭（`closet.management.enabled=false`），开启后供任意宿主平台以服务身份调用。
    设计说明见 `docs/design/2026-10-07-管理平台接入与可插拔管理接口设计.md`；1.1（运维、KPI、大屏与数据出口、模板审核）见
    `docs/design/2026-10-09-管理接口二期：运维、KPI与大屏数据设计.md`。

    认证：每个请求都必须携带 HMAC 签名头（见 `components.securitySchemes.closetHmac`）。
    时间字段均为 Unix 毫秒，字段名以 `AtMs` 结尾；日期参数为 `YYYY-MM-DD`，按 Asia/Shanghai 解释，`to` 含当天。
    错误统一为 RFC 9457 Problem Details（`application/problem+json`）。

    数据口径：鱼搭不记录实际穿着。“使用”指衣物出现在已保存搭配中的次数；衣物分类映射版本为 `closet-families-v1`。
servers:
  - url: /api/manage/v1
security:
  - closetHmac: []
tags:
  - name: users
  - name: insights
  - name: ops
    description: 运维状态、后台任务、管理操作日志（只读）
  - name: dashboard
    description: 大屏快照（只含汇总，不含用户名）
  - name: exports
    description: 数仓出口：按天宽表与去标识明细事件
  - name: templates
    description: 搭配模板审核
paths:
  /users:
    get:
      tags: [users]
      operationId: listUsers
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: status, in: query, schema: { type: string, enum: [ENABLED, DISABLED] } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: sort, in: query, schema: { type: string, enum: [createdAt, username, lastActiveAt], default: createdAt } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 用户分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [users]
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: 已创建；新用户首次登录必须修改密码
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /users/{username}:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    get:
      tags: [users]
      operationId: getUser
      responses:
        '200':
          description: 用户详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/status:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    patch:
      tags: [users]
      operationId: updateUserStatus
      description: 禁用时同一事务内吊销便携登录链接并删除全部会话。不可禁用最后一个启用的 ADMIN。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                type: object
                required: [username, enabled, revokedSessions]
                properties:
                  username: { type: string }
                  enabled: { type: boolean }
                  revokedSessions: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /users/{username}/role:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    patch:
      tags: [users]
      operationId: updateUserRole
      description: 角色变化后删除该用户全部会话。不可降级最后一个启用的 ADMIN。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                type: object
                required: [username, role, revokedSessions]
                properties:
                  username: { type: string }
                  role: { $ref: '#/components/schemas/Role' }
                  revokedSessions: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /users/{username}/password-reset:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    post:
      tags: [users]
      operationId: resetUserPassword
      description: 设置新密码（为空则生成临时密码，仅本次返回），要求下次登录修改，吊销便携链接并删除会话。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password: { $ref: '#/components/schemas/OptionalPassword' }
      responses:
        '200':
          description: 已重置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CredentialResult'
                  - type: object
                    required: [revokedSessions]
                    properties:
                      revokedSessions: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/sessions:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    get:
      tags: [users]
      operationId: listUserSessions
      responses:
        '200':
          description: 未过期会话（不暴露会话 ID）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [users]
      operationId: revokeUserSessions
      responses:
        '200':
          description: 已删除全部会话
          content:
            application/json:
              schema:
                type: object
                required: [revokedSessions]
                properties:
                  revokedSessions: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/portable-links:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    get:
      tags: [users]
      operationId: listUserPortableLinks
      responses:
        '200':
          description: 便携登录链接
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PortableLink' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/portable-links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/Username'
      - { name: linkId, in: path, required: true, schema: { type: string, maxLength: 36 } }
    delete:
      tags: [users]
      operationId: revokeUserPortableLink
      responses:
        '204': { description: 已吊销 }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{username}/quota:
    parameters: [ { $ref: '#/components/parameters/Username' } ]
    get:
      tags: [users]
      operationId: getUserQuota
      responses:
        '200':
          description: 今日额度
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quota' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [users]
      operationId: updateUserQuota
      description: '`null` 表示恢复默认限额。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [imageDailyLimit, agentDailyLimit]
              properties:
                imageDailyLimit: { type: [integer, 'null'], minimum: 0, maximum: 1000 }
                agentDailyLimit: { type: [integer, 'null'], minimum: 0, maximum: 1000 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quota' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /insights/overview:
    get:
      tags: [insights]
      operationId: insightOverview
      parameters:
        - $ref: '#/components/parameters/ScopeUsername'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: 概览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /insights/wardrobe:
    get:
      tags: [insights]
      operationId: insightWardrobe
      parameters:
        - $ref: '#/components/parameters/ScopeUsername'
      responses:
        '200':
          description: ACTIVE 衣物构成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wardrobe' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /insights/usage:
    get:
      tags: [insights]
      operationId: insightUsage
      parameters:
        - $ref: '#/components/parameters/ScopeUsername'
      responses:
        '200':
          description: 搭配使用与闲置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /insights/trends:
    get:
      tags: [insights]
      operationId: insightTrends
      parameters:
        - $ref: '#/components/parameters/ScopeUsername'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: metric
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 15
            items: { $ref: '#/components/schemas/TrendMetric' }
        - { name: granularity, in: query, schema: { type: string, enum: [day, week, month], default: day } }
      responses:
        '200':
          description: 时间序列（空桶补 0，周以周一为起点，月以 1 日为起点；active_users 按桶去重）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trends' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /insights/recommendations:
    get:
      tags: [insights]
      operationId: insightRecommendations
      description: 推荐效果 KPI。采用＝点赞、在搭台打开，或展示后 3 天内打卡穿过这一套的全部衣物（按用户分别匹配后汇总）。
      parameters:
        - $ref: '#/components/parameters/ScopeUsername'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: 推荐效果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationKpi' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /insights/ai:
    get:
      tags: [insights]
      operationId: insightAi
      description: 模型与额度用量（只给 token 数，费用由接入方按单价换算）。不传 username 时附 token 用量 Top 10 用户。
      parameters:
        - $ref: '#/components/parameters/ScopeUsername'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: 模型用量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiUsage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /ops/status:
    get:
      tags: [ops]
      operationId: opsStatus
      description: 运维总览。status 为 UP 或 DEGRADED，issues 给出原因代码与说明；不含密钥、服务商地址、用户名。
      responses:
        '200':
          description: 运维状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsStatus' }
        '401': { $ref: '#/components/responses/Problem' }
  /ops/tasks:
    get:
      tags: [ops]
      operationId: opsTasks
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          description: 默认 FAILED
          schema:
            type: array
            items: { type: string, enum: [QUEUED, RUNNING, WAITING_QUOTA, CANCEL_REQUESTED, SUCCEEDED, FAILED, UNKNOWN, INTERRUPTED, CANCELLED] }
        - { name: kind, in: query, schema: { type: string, pattern: '^[A-Z_]{1,40}$' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 后台任务（不含载荷）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /ops/operation-log:
    get:
      tags: [ops]
      operationId: opsOperationLog
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - { name: action, in: query, schema: { type: string, maxLength: 64 } }
        - { name: targetUsername, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_.-]{2,80}$' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 管理接口操作日志
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationLogPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /dashboard/snapshot:
    get:
      tags: [dashboard]
      operationId: dashboardSnapshot
      description: 大屏一次拿全。缓存 15 秒，建议按 refreshAfterMs 轮询。只含汇总，不含用户名、衣物名称或图片。
      responses:
        '200':
          description: 大屏快照
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSnapshot' }
        '401': { $ref: '#/components/responses/Problem' }
  /exports/daily:
    get:
      tags: [exports]
      operationId: exportDaily
      description: 按天宽表，最长 366 天。format=csv 时返回带表头的 UTF-8 CSV。
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        '200':
          description: 每天一行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyExport' }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /exports/events:
    get:
      tags: [exports]
      operationId: exportEvents
      description: |
        去标识明细事件，按 (atMs, type, id) 排序，用 nextCursor 增量拉取；同一游标重复拉取结果一致。
        只返回 watermarkMs（当前时间−5 秒）之前的事件。用户只以 userKey（HMAC-SHA256(盐, 用户名) 前 16 位）出现。
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
        - { name: since, in: query, description: 起始毫秒时间戳（含），与 cursor 二选一, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
        - name: types
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/EventType' }
      responses:
        '200':
          description: 一页事件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /templates:
    get:
      tags: [templates]
      operationId: listTemplates
      responses:
        '200':
          description: 全部搭配模板（资源文件 + 样本生成的草稿）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateList' }
        '401': { $ref: '#/components/responses/Problem' }
  /templates/{id}:
    patch:
      tags: [templates]
      operationId: reviewTemplate
      description: 与鱼搭管理员审核共用存储，立即生效；记操作日志，审核人记为 manage:{keyId}:{X-Operator}。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,80}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                reviewStatus: { type: string, enum: [PENDING_REVIEW, APPROVED, REJECTED] }
                enabled: { type: boolean }
                bonus: { type: number, minimum: 0, maximum: 5 }
      responses:
        '200':
          description: 审核后的模板
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    closetHmac:
      type: apiKey
      in: header
      name: X-Closet-Signature
      description: |
        必填头：`X-Closet-Key-Id`、`X-Closet-Timestamp`（Unix 毫秒）、`X-Closet-Nonce`（16–64 位 `[A-Za-z0-9_-]`）、`X-Closet-Signature`。
        可选头：`X-Operator`（≤128 字符单行）、`X-Request-Id`（≤128 字符 `[A-Za-z0-9._:-]`），二者参与签名。

        签名 = base64url 无填充 (HMAC-SHA256(secret, canonical))，canonical 为以下各行用 `\n` 连接（末尾无换行）：
        ```
        CLOSET-HMAC-SHA256
        <METHOD 大写>
        <原始路径，不含 query，不解码>
        <规范化 query：按名再按值排序，RFC 3986 编码，name=value 以 & 连接；无则空串>
        <timestamp>
        <nonce>
        <X-Operator 或空串>
        <X-Request-Id 或空串>
        <body SHA-256 小写十六进制>
        ```
        时间偏差上限默认 300 秒；nonce 在 600 秒内不可重复。
  parameters:
    Username:
      name: username
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_.-]{2,80}$' }
    ScopeUsername:
      name: username
      in: query
      description: 缺省为全站
      schema: { type: string, pattern: '^[A-Za-z0-9_.-]{2,80}$' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    From:
      name: from
      in: query
      description: 缺省为 to 往前 29 天；区间最长 366 天
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: 缺省为今天（Asia/Shanghai）
      schema: { type: string, format: date }
  responses:
    Problem:
      description: 错误
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Role:
      type: string
      enum: [USER, ADMIN]
    OptionalPassword:
      type: [string, 'null']
      minLength: 12
      maxLength: 200
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, example: 'urn:closet:problem:user-not-found' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [VALIDATION_FAILED, MALFORMED_JSON, MANAGEMENT_SIGNATURE_MISSING, MANAGEMENT_KEY_UNKNOWN,
                 MANAGEMENT_TIMESTAMP_SKEWED, MANAGEMENT_SIGNATURE_INVALID, MANAGEMENT_REPLAYED, USER_NOT_FOUND,
                 PORTABLE_LINK_NOT_FOUND, USER_ALREADY_EXISTS, LAST_ADMIN_PROTECTED, PAYLOAD_TOO_LARGE,
                 MANAGEMENT_BUSY, INTERNAL_ERROR]
        requestId: { type: string }
        violations:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    UserSummary:
      type: object
      required: [username, role, enabled, mustChangePassword, createdAtMs, activeSessionCount, garmentCount, outfitCount]
      properties:
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        enabled: { type: boolean }
        mustChangePassword: { type: boolean }
        createdAtMs: { type: integer, format: int64 }
        lastActiveAtMs: { type: [integer, 'null'], format: int64, description: 未过期会话最近访问时间，近似值 }
        activeSessionCount: { type: integer }
        garmentCount: { type: integer, description: 仅 ACTIVE }
        outfitCount: { type: integer }
    UserPage:
      type: object
      required: [items, total, page, size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
    UserDetail:
      type: object
      required: [username, role, enabled, mustChangePassword, createdAtMs, activeSessionCount, garments,
                 outfitCount, outfitPlanCount, quickIntakeCount, hasWearerProfile, activePortableLinkCount, quota]
      properties:
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        enabled: { type: boolean }
        mustChangePassword: { type: boolean }
        createdAtMs: { type: integer, format: int64 }
        lastActiveAtMs: { type: [integer, 'null'], format: int64 }
        activeSessionCount: { type: integer }
        garments:
          type: object
          description: 键为实际出现的 closet_status
          additionalProperties: { type: integer }
        outfitCount: { type: integer }
        outfitPlanCount: { type: integer }
        quickIntakeCount: { type: integer }
        hasWearerProfile: { type: boolean }
        activePortableLinkCount: { type: integer }
        quota: { $ref: '#/components/schemas/Quota' }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, role]
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9_.-]{2,80}$' }
        role: { $ref: '#/components/schemas/Role' }
        password: { $ref: '#/components/schemas/OptionalPassword' }
    CredentialResult:
      type: object
      required: [username, temporaryPassword]
      properties:
        username: { type: string }
        temporaryPassword:
          type: [string, 'null']
          description: 仅在未指定密码时返回一次，调用方不得记录
    Session:
      type: object
      required: [sessionRef, createdAtMs, lastAccessAtMs, expiresAtMs, portable]
      properties:
        sessionRef: { type: string, description: 不可逆引用，不能用于登录 }
        createdAtMs: { type: integer, format: int64 }
        lastAccessAtMs: { type: integer, format: int64 }
        expiresAtMs: { type: integer, format: int64 }
        portable: { type: boolean }
    PortableLink:
      type: object
      required: [id, createdAtMs, expiresAtMs, status]
      properties:
        id: { type: string }
        createdAtMs: { type: integer, format: int64 }
        expiresAtMs: { type: integer, format: int64 }
        sessionExpiresAtMs: { type: [integer, 'null'], format: int64 }
        status: { type: string }
    QuotaItem:
      type: object
      required: [limit, used, overridden]
      properties:
        limit: { type: integer }
        used: { type: integer }
        overridden: { type: boolean }
    Quota:
      type: object
      required: [image, agent, resetAtMs]
      properties:
        image: { $ref: '#/components/schemas/QuotaItem' }
        agent: { $ref: '#/components/schemas/QuotaItem' }
        resetAtMs: { type: integer, format: int64 }
    Scope:
      type: object
      required: [username]
      properties:
        username: { type: [string, 'null'] }
        from: { type: string, format: date }
        to: { type: string, format: date }
    Overview:
      type: object
      required: [scope, garments, outfits, outfitPlans, quickIntakes, ai, generatedAtMs, mappingVersion]
      properties:
        scope: { $ref: '#/components/schemas/Scope' }
        users:
          description: 仅全站视图返回
          type: object
          required: [total, enabled, activeInRange, createdInRange]
          properties:
            total: { type: integer }
            enabled: { type: integer }
            activeInRange: { type: integer }
            createdInRange: { type: integer }
        garments:
          type: object
          required: [active, draft, createdInRange, adoptedInRange, adoptionRate]
          properties:
            active: { type: integer }
            draft: { type: integer }
            createdInRange: { type: integer }
            adoptedInRange: { type: integer }
            adoptionRate: { type: [number, 'null'], description: 区间内创建且当前为 ACTIVE 的比例；无创建时为 null }
        outfits:
          type: object
          required: [total, createdInRange]
          properties:
            total: { type: integer }
            createdInRange: { type: integer }
        outfitPlans:
          type: object
          required: [createdInRange]
          properties:
            createdInRange: { type: integer }
        quickIntakes:
          type: object
          required: [createdInRange]
          properties:
            createdInRange: { type: integer }
        ai:
          type: object
          required: [imageUnitsInRange, agentMessagesInRange]
          properties:
            imageUnitsInRange: { type: integer }
            agentMessagesInRange: { type: integer }
        generatedAtMs: { type: integer, format: int64 }
        mappingVersion: { type: string }
    KeyCount:
      type: object
      required: [key, count]
      properties:
        key: { type: string }
        count: { type: integer }
    Wardrobe:
      type: object
      required: [scope, totalActive, categories, colors, seasons, unknownCategoryCount, unknownSeasonCount,
                 favoriteCount, wearingConfirmedCount, mappingVersion]
      properties:
        scope: { $ref: '#/components/schemas/Scope' }
        totalActive: { type: integer }
        categories: { type: array, items: { $ref: '#/components/schemas/KeyCount' } }
        colors: { type: array, items: { $ref: '#/components/schemas/KeyCount' }, description: 前 20 项，其余并入“其他” }
        seasons: { type: array, items: { $ref: '#/components/schemas/KeyCount' } }
        unknownCategoryCount: { type: integer }
        unknownSeasonCount: { type: integer }
        favoriteCount: { type: integer }
        wearingConfirmedCount: { type: integer }
        mappingVersion: { type: string }
    GarmentRef:
      type: object
      required: [garmentId, owner, family, createdAtMs]
      properties:
        garmentId: { type: string, format: uuid }
        owner: { type: string }
        name: { type: [string, 'null'] }
        family: { type: string }
        createdAtMs: { type: integer, format: int64 }
        outfitCount: { type: integer }
    Usage:
      type: object
      required: [scope, outfitCount, topUsed, idle, byFamily]
      properties:
        scope: { $ref: '#/components/schemas/Scope' }
        outfitCount: { type: integer }
        topUsed: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/GarmentRef' } }
        idle:
          type: object
          required: [count, ratio, sample]
          properties:
            count: { type: integer }
            ratio: { type: [number, 'null'] }
            sample: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/GarmentRef' } }
        byFamily:
          type: array
          items:
            type: object
            required: [key, active, usedInOutfits]
            properties:
              key: { type: string }
              active: { type: integer }
              usedInOutfits: { type: integer }
    TrendMetric:
      type: string
      enum: [garments_created, garments_adopted, outfits_created, quick_intakes, image_units, agent_messages, users_created,
             active_users, recommendations_shown, recommendation_likes, recommendation_dislikes, wear_logs, model_calls, model_tokens, ootd_samples]
    Trends:
      type: object
      required: [granularity, buckets, series]
      properties:
        granularity: { type: string, enum: [day, week, month] }
        buckets: { type: array, items: { type: string, format: date } }
        series:
          type: array
          items:
            type: object
            required: [metric, values]
            properties:
              metric: { $ref: '#/components/schemas/TrendMetric' }
              values: { type: array, items: { type: integer } }
    Rate:
      type: [number, 'null']
      description: 0~1，分母为 0 时为 null
    AdoptionRow:
      type: object
      properties:
        shown: { type: integer }
        adopted: { type: integer }
        adoptionRate: { $ref: '#/components/schemas/Rate' }
    RecommendationKpi:
      type: object
      required: [scope, shown, adopted, adoptionRate, liked, disliked, likeRate, openedInWorkspace, wornWithin3Days, swaps, users, bySource, byRank, templates, daily, definition]
      properties:
        scope: { type: object }
        shown: { type: integer }
        adopted: { type: integer }
        adoptionRate: { $ref: '#/components/schemas/Rate' }
        liked: { type: integer }
        disliked: { type: integer }
        likeRate: { $ref: '#/components/schemas/Rate' }
        openedInWorkspace: { type: integer }
        wornWithin3Days: { type: integer }
        swaps: { type: integer }
        users: { type: integer, description: 范围内收到过推荐的用户数 }
        bySource: { type: array, items: { allOf: [{ $ref: '#/components/schemas/AdoptionRow' }, { type: object, properties: { source: { type: string, description: 'PAGE 推荐区 / AGENT 助手 / INSPIRATION 今日灵感 / SWAP / MORE' } } }] } }
        byRank: { type: array, items: { allOf: [{ $ref: '#/components/schemas/AdoptionRow' }, { type: object, properties: { rank: { type: integer } } }] } }
        templates: { type: array, items: { allOf: [{ $ref: '#/components/schemas/AdoptionRow' }, { type: object, properties: { template: { type: string } } }] } }
        daily: { type: array, items: { type: object, properties: { date: { type: string, format: date }, shown: { type: integer }, adopted: { type: integer } } } }
        definition: { type: string }
    AiUsage:
      type: object
      required: [scope, byFeature, totals, imageUnits, agentMessages, recommendations, note]
      properties:
        scope: { type: object }
        byFeature:
          type: array
          items:
            type: object
            properties:
              feature: { type: string, description: 'AGENT 助手、OOTD_EXTRACT 整套穿搭样本提取等' }
              calls: { type: integer }
              inputTokens: { type: integer }
              outputTokens: { type: integer }
              unknownUsage: { type: integer, description: 上游未返回用量的调用次数 }
        totals: { type: object, properties: { calls: { type: integer }, inputTokens: { type: integer }, outputTokens: { type: integer } } }
        imageUnits: { type: integer }
        agentMessages: { type: integer }
        recommendations: { type: object, properties: { total: { type: integer }, zeroModel: { type: integer }, zeroModelRatio: { type: number } } }
        topUsers: { type: array, items: { type: object, properties: { username: { type: string }, calls: { type: integer }, tokens: { type: integer } } } }
        note: { type: string }
    OpsIssue:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [EMBEDDING_MODEL_MISSING, SEGMENTATION_MODEL_MISSING, SEMANTIC_INDEX_BEHIND, QUEUE_BACKLOG, TASK_FAILURES, DISK_FULL, RECOGNITION_NOT_CONFIGURED, AGENT_RUNTIME_UNREACHABLE] }
        message: { type: string }
    OpsStatus:
      type: object
      required: [status, issues, app, jvm, storage, models, indexes, queue, providers, sessions, generatedAtMs]
      properties:
        status: { type: string, enum: [UP, DEGRADED] }
        issues: { type: array, items: { $ref: '#/components/schemas/OpsIssue' } }
        app: { type: object, properties: { version: { type: string }, startedAtMs: { type: integer }, uptimeMs: { type: integer }, java: { type: string } } }
        jvm: { type: object, properties: { heapUsedBytes: { type: integer }, heapMaxBytes: { type: integer }, nonHeapUsedBytes: { type: integer }, threads: { type: integer }, processors: { type: integer }, systemLoadAverage: { type: number }, processCpuLoad: { type: [number, 'null'] }, processRssBytes: { type: [integer, 'null'], description: '进程常驻内存（含模型的堆外内存），仅 Linux' }, systemMemoryTotalBytes: { type: integer }, systemMemoryFreeBytes: { type: integer } } }
        storage: { type: object, properties: { totalBytes: { type: integer }, usableBytes: { type: integer }, usedRatio: { type: number }, databaseBytes: { type: [integer, 'null'] } } }
        models: { type: object }
        indexes: { type: object }
        queue: { type: object, properties: { byStatus: { type: object }, byKind: { type: array, items: { type: object } }, oldestQueuedAgeMs: { type: [integer, 'null'] }, failed24h: { type: integer } } }
        providers: { type: object }
        sessions: { type: object, properties: { active: { type: integer }, onlineLast5Min: { type: integer } } }
        generatedAtMs: { type: integer }
    TaskPage:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              kind: { type: string }
              ownerUsername: { type: [string, 'null'] }
              status: { type: string }
              stage: { type: integer }
              pool: { type: string }
              priority: { type: integer }
              waitReason: { type: [string, 'null'] }
              errorMessage: { type: [string, 'null'], description: 截断到 300 字 }
              attempts: { type: integer }
              createdAtMs: { type: integer }
              updatedAtMs: { type: integer }
              nextRunAtMs: { type: integer }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
    OperationLogPage:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              occurredAtMs: { type: integer }
              keyId: { type: string }
              operator: { type: [string, 'null'] }
              requestId: { type: [string, 'null'] }
              action: { type: string }
              targetUsername: { type: [string, 'null'] }
              result: { type: string }
              detail: { type: [string, 'null'] }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
    DashboardSnapshot:
      type: object
      required: [generatedAtMs, refreshAfterMs, tiles, hourly, daily, distributions, ops]
      properties:
        generatedAtMs: { type: integer }
        refreshAfterMs: { type: integer }
        tiles:
          type: object
          properties:
            usersTotal: { type: integer }
            usersNewToday: { type: integer }
            activeToday: { type: integer }
            active7d: { type: integer }
            active30d: { type: integer }
            onlineNow: { type: integer, description: 近 5 分钟有请求的登录用户 }
            garmentsActive: { type: integer }
            garmentsToday: { type: integer }
            outfitsTotal: { type: integer }
            outfitsToday: { type: integer }
            recommendationsToday: { type: integer }
            adoptionRate7d: { $ref: '#/components/schemas/Rate' }
            wearLogsToday: { type: integer }
            agentMessagesToday: { type: integer }
            imageUnitsToday: { type: integer }
            modelTokensToday: { type: integer }
        hourly: { type: object, description: 近 24 个整点（含当前小时）, properties: { hours: { type: array, items: { type: string } }, series: { type: array, items: { type: object } } } }
        daily: { type: object, description: 近 30 天, properties: { days: { type: array, items: { type: string, format: date } }, series: { type: array, items: { type: object } } } }
        distributions: { type: object }
        ops: { type: object, properties: { status: { type: string }, issues: { type: integer }, queueBacklog: { type: integer }, failed24h: { type: integer } } }
    DailyExport:
      type: object
      required: [from, to, columns, rows]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: object, additionalProperties: true } }
    EventType:
      type: string
      enum: [garment_created, model_usage, outfit_created, quick_intake, recommendation_feedback, recommendation_shown, user_created, wear_logged]
    EventPage:
      type: object
      required: [items, nextCursor, hasMore, watermarkMs]
      properties:
        items:
          type: array
          items:
            type: object
            required: [type, id, atMs, userKey, attrs]
            properties:
              type: { $ref: '#/components/schemas/EventType' }
              id: { type: string }
              atMs: { type: integer }
              userKey: { type: string, description: 'HMAC-SHA256(盐, 用户名) 前 16 位十六进制；换盐即变' }
              attrs: { type: object, additionalProperties: true }
        nextCursor: { type: string }
        hasMore: { type: boolean }
        watermarkMs: { type: integer }
    Template:
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        source: { type: string, enum: [FILE, SAMPLE] }
        reviewStatus: { type: string, enum: [PENDING_REVIEW, APPROVED, REJECTED] }
        enabled: { type: boolean }
        active: { type: boolean }
        bonus: { type: number }
        defaultBonus: { type: number }
        reviewedBy: { type: [string, 'null'] }
        reviewedAtMs: { type: integer }
        kind: { type: string, enum: [CLASSIC, TREND] }
        audience: { type: array, items: { type: string } }
        seasons: { type: array, items: { type: string } }
        occasions: { type: array, items: { type: string } }
        validFrom: { type: [string, 'null'], format: date }
        validUntil: { type: [string, 'null'], format: date }
        reference: { type: string }
        slots: { type: array, items: { type: object } }
    TemplateList:
      type: object
      required: [version, maxBonus, active, items]
      properties:
        version: { type: string }
        maxBonus: { type: number }
        active: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/Template' } }
