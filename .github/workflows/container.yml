name: Backend containers

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Java and Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json
      - name: Verify Java backend
        run: mvn -B verify
      - name: Verify backend-only packaging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          jar = next(Path('target').glob('*.jar'))
          with ZipFile(jar) as archive:
              forbidden = [name for name in archive.namelist() if
                  name.startswith('BOOT-INF/classes/spa-test/') or
                  name == 'BOOT-INF/classes/static/index.html' or
                  name.startswith('BOOT-INF/classes/static/assets/')]
          if forbidden:
              raise SystemExit(f'Test fixtures or local SPA output leaked into backend package: {forbidden}')
          print('Backend-only package verified; test fixtures and local SPA output are absent.')
          PY
      - name: Test and build TypeScript Agent
        working-directory: agent-runtime
        run: |
          npm ci
          npm test
          npm run build

  build-images:
    name: Build backend container images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Java backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build TypeScript Agent image
        uses: docker/build-push-action@v6
        with:
          context: ./agent-runtime
          file: ./agent-runtime/Dockerfile
          push: false
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

  publish:
    name: Publish GHCR images
    needs: [test, build-images]
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare Java backend image tags
        id: backend-metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - name: Prepare TypeScript Agent image tags
        id: agent-metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-agent
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - name: Build and push Java backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.backend-metadata.outputs.tags }}
          labels: ${{ steps.backend-metadata.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build and push TypeScript Agent image
        uses: docker/build-push-action@v6
        with:
          context: ./agent-runtime
          file: ./agent-runtime/Dockerfile
          push: true
          tags: ${{ steps.agent-metadata.outputs.tags }}
          labels: ${{ steps.agent-metadata.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
