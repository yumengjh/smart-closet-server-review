server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: YIXU_SESSION
        http-only: true
        same-site: lax
        max-age: ${CLOSET_SESSION_COOKIE_MAX_AGE:7d}
  tomcat:
    threads:
      max: 16
spring:
  config:
    import: optional:file:./.local/generation.yml
  application:
    name: smart-closet-server
  datasource:
    url: ${CLOSET_DB_URL:jdbc:h2:file:${closet.storage-dir}/db/closet}
    username: ${CLOSET_DB_USER:sa}
    password: ${CLOSET_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 4
  session:
    timeout: ${CLOSET_SESSION_TIMEOUT:7d}
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
      file-size-threshold: 0
closet:
  storage-dir: ${CLOSET_STORAGE_DIR:./data}
  model-path: ${CLOSET_MODEL_PATH:./models/u2net.onnx}
  max-pixels: 12000000
  grabcut-max-side: 1000
  inference-threads: 2
workflow:
  max-queued: 30
  poll-ms: 300
recognition:
  default-provider: yumg
  providers:
    yumg:
      credential-provider: yumg
      protocol: OPENAI_CHAT
      default-model: ${CLOSET_RECOGNITION_MODEL:gpt-6-luna}
      max-output-tokens: 4096
      reasoning-effort: low
mybatis-plus:
  global-config:
    banner: false

agent:
  runtime-url: ${CLOSET_AGENT_RUNTIME_URL:http://127.0.0.1:8091}
  callback-url: ${CLOSET_AGENT_CALLBACK_URL:http://127.0.0.1:8080}
  secret: ${CLOSET_AGENT_SECRET:}
  credential-provider: yumg
  default-model: ${CLOSET_AGENT_MODEL:gpt-6-luna}
  allowed-models: gpt-6-luna,gpt-5.6-luna
  daily-limit: ${CLOSET_AGENT_DAILY_LIMIT:30}
  max-tool-calls: 8
  timeout-seconds: 120
