server:
  address: 127.0.0.1
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 16
spring:
  config:
    import: optional:file:./.local/generation.yml
  application:
    name: smart-closet-server
  datasource:
    url: ${CLOSET_DB_URL:jdbc:h2:file:${closet.storage-dir}/db/closet}
    username: ${CLOSET_DB_USER:sa}
    password: ${CLOSET_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 4
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
      file-size-threshold: 0
closet:
  storage-dir: ${CLOSET_STORAGE_DIR:./data}
  model-path: ${CLOSET_MODEL_PATH:./models/u2net.onnx}
  max-pixels: 12000000
  grabcut-max-side: 1000
  inference-threads: 2
workflow:
  max-queued: 30
  poll-ms: 300
mybatis-plus:
  global-config:
    banner: false
